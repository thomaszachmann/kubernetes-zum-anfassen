# k8s/namespace.yaml – Stand Ende Tag 6
apiVersion: v1
kind: Namespace
metadata:
  name: notes
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: notes
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: notes
  namespace: notes
spec:
  hard:
    pods: "20"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 4Gi
