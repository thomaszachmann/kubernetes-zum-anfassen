# chart/notes/templates/gateway.yaml – Stand Ende Tag 11
{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: notes
  labels:
    {{- include "notes.labels" (dict "ctx" $ "name" "gateway") | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gateway.hostname | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  labels:
    {{- include "notes.labels" (dict "ctx" $ "name" "web") | nindent 4 }}
spec:
  parentRefs:
    - name: notes
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - backendRefs:
        - name: web
          port: 3000
{{- end }}
