# chart/notes/templates/networkpolicy.yaml – Stand Ende Tag 11
{{- if .Values.networkPolicy.enabled }}
# 1. Alles Eingehende im Namespace verbieten …
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# 2. … web nur vom Gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-gateway
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: web}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: test}
      ports:
        - port: 3000
---
# 3. … api nur von web, worker und dem Helm-Test
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-clients
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: api}
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [web, worker, test]
      ports:
        - port: 8080
---
# 4. … Postgres nur von api und migrate
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-from-api
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: db}
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [api, migrate]
      ports:
        - port: 5432
{{- end }}
