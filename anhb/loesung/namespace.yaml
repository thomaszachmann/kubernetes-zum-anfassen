# namespace.yaml – Anhang B, Übung 1: zweiter Mandant „pruefung"
apiVersion: v1
kind: Namespace
metadata:
  name: pruefung
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: pruefung
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pruefung
  namespace: pruefung
spec:
  hard:
    pods: "10"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 4Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notes
  namespace: pruefung
automountServiceAccountToken: false
